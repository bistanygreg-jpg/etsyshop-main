<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@700&family=Pacifico&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
body{background:linear-gradient(#2a2433,#16121d)}
/* cassette deck */
.deck{position:absolute;left:60px;top:90px;width:960px;height:430px;border-radius:34px;background:linear-gradient(#3a3344,#241f2c);box-shadow:inset 0 4px 0 rgba(255,255,255,.08),0 20px 40px rgba(0,0,0,.5)}
.tape{position:absolute;left:70px;top:46px;width:820px;height:300px;border-radius:24px;background:#f4ead3;border:6px solid #111}
.label{position:absolute;left:30px;right:30px;top:20px;height:70px;background:#fff;border-bottom:10px solid var(--pink);font-family:'Permanent Marker';font-size:52px;color:#1b1b1b;padding:4px 20px;white-space:nowrap;overflow:hidden}
.win{position:absolute;left:150px;right:150px;top:120px;height:140px;background:#1b1820;border-radius:70px}
.reel{position:absolute;top:10px;width:120px;height:120px;border-radius:50%;background:repeating-conic-gradient(#f4ead3 0 20deg,#1b1820 20deg 60deg);border:10px solid #f4ead3;animation:spin 1100ms linear infinite}
.reel::after{content:"";position:absolute;inset:34px;border-radius:50%;background:#1b1820;border:6px solid #f4ead3}
.r1{left:40px}.r2{right:40px}
@keyframes spin{to{transform:rotate(360deg)}}
.fast .reel{animation:rew 280ms linear infinite reverse}
@keyframes rew{to{transform:rotate(360deg)}}
.btns{position:absolute;left:250px;top:360px;display:flex;gap:22px}
.btns div{width:96px;height:46px;border-radius:10px;background:#57506a;color:#fff;font-size:30px;text-align:center;line-height:46px;box-shadow:0 6px 0 #1a1720}
.play{animation:press 300ms 900ms both;background:var(--pink)!important}
@keyframes press{50%{transform:translateY(6px);box-shadow:0 0 0 #1a1720}}
/* screen */
.screen{position:absolute;left:90px;top:590px;width:900px;height:900px;border:8px solid #111;border-radius:20px;overflow:hidden;background:#000;box-shadow:0 0 0 6px var(--cyan),0 24px 50px rgba(0,0,0,.5)}
.shot{position:absolute;inset:0;opacity:0}
.shot img{width:100%;height:100%;object-fit:cover}
@keyframes tapein{0%{opacity:1;transform:translateX(100%)}12%{transform:none}97%{opacity:1}100%{opacity:0}}
@keyframes tapein2{0%{opacity:1;transform:translateX(100%)}12%{transform:none}100%{opacity:1}}
.trk{position:absolute;left:0;right:0;top:1540px;text-align:center;opacity:0}
.trk .n{font-family:'Bungee';font-size:44px;color:var(--yel);letter-spacing:.08em}
.trk .t{font-family:'Permanent Marker';font-size:90px;color:#fff;margin-top:6px}
.hook{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,16,31,.55)}
</style></head>
<body data-duration="11500">
<div class="deck" id="deck">
 <div class="tape">
  <div class="label">TOTALLY ANALOG · side A</div>
  <div class="win"><div class="reel r1"></div><div class="reel r2"></div></div>
 </div>
 <div class="btns"><div>⏪</div><div class="play">▶</div><div>⏩</div><div>■</div></div>
</div>

<div class="screen">
 <div class="shot" style="animation:tapein 2100ms 0ms both"><img src="6b0330ea27184f8ac608624a_hero.jpg" style="animation:push 2100ms both">
  <div class="hook"><div class="bungee" style="font-size:96px;color:#fff;text-shadow:5px 5px 0 var(--pink);animation:pop 450ms 200ms both">MAKE ME</div><div class="bungee" style="font-size:96px;color:#fff;text-shadow:5px 5px 0 var(--pink);animation:pop 450ms 450ms both">A MIXTAPE</div><div class="bungee" style="margin-top:40px;font-size:54px;background:var(--yel);padding:10px 34px;animation:blink 500ms 1000ms steps(1) 3 both">PRESS ▶ PLAY</div></div></div>
 <div class="shot" style="animation:tapein 2000ms 2000ms both"><img src="6b0330ea27184f8ac608624a_side.jpg"></div>
 <div class="shot" style="animation:tapein 2000ms 3900ms both"><img src="6b0330ea27184f8ac608624a_design.jpg" style="transform-origin:50% 42%;animation:zin 2000ms 3900ms both"></div>
 <div class="shot" style="animation:tapein 1900ms 5800ms both"><img src="6b0330ea27184f8ac608624a_turn.jpg"></div>
 <div class="shot" style="animation:tapein 1800ms 7600ms both"><img src="6b0330ea27184f8ac608624a_duo.jpg"></div>
 <div class="shot" style="animation:tapein2 2200ms 9300ms both"><img src="6b0330ea27184f8ac608624a_fold.jpg"></div>
</div>
<style>@keyframes zin{from{transform:scale(1)}to{transform:scale(1.5)}}</style>

<div class="trk" style="animation:on 2000ms 2000ms both"><div class="n">TRACK A1</div><div class="t">The look</div></div>
<div class="trk" style="animation:on 2000ms 3900ms both"><div class="n">TRACK A2</div><div class="t">Hand-labelled</div></div>
<div class="trk" style="animation:on 1900ms 5800ms both"><div class="n">TRACK A3</div><div class="t">Flip to side B</div></div>
<div class="trk" style="animation:on 1800ms 7600ms both"><div class="n">TRACK A4</div><div class="t">The crew mix</div></div>
<div class="trk" style="top:1515px;animation:in 300ms 9300ms both">
 <div class="n" style="font-size:40px">BE KIND, REWIND ⏪</div>
 <div style="margin-top:20px"><span class="cta">SHOP NOW</span></div>
 <div class="brand">MIXTAPE MERCANTILE</div>
</div>
<style>#deck{animation:none}</style>
<style>
/* reels go into rewind at the end */
.reel{animation:spin 1100ms linear infinite, rewind 2200ms 9300ms linear both}
@keyframes rewind{from{rotate:0deg}to{rotate:-2400deg}}
</style>
</body></html>

<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;0,9..144,900;1,9..144,500;1,9..144,600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">

<!-- Retail v3, Nov 25: T23 Snow Day Committee. Left-chest front + statement back, Comfort Colors 1717 (light colours). Navy + deep gold. -->
<svg width="0" height="0" style="position:absolute"><defs>
 <g id="arm" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M0 0 L0 -40"/><path d="M-10 -22 L0 -12 L10 -22"/><path d="M-9 -38 L0 -29 L9 -38"/>
 </g>
 <g id="flake"><use href="#arm"/><use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/><use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/><use href="#arm" transform="rotate(300)"/>
  <circle r="5" fill="currentColor"/></g>
</defs></svg>

<div class="wrap" id="d_snow_front"><svg width="1800" height="1100" viewBox="0 0 600 366" style="color:#1F3B57">

 <text x="300" y="215" text-anchor="middle" font-family="Fraunces" font-style="italic" font-weight="600" font-size="88" fill="#1F3B57">Snow Day</text>
 <text x="300" y="295" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="40" letter-spacing="14" fill="#B8862F">COMMITTEE</text>
</svg></div>
<div class="wrap" id="d_snow_back"><svg width="3000" height="3200" viewBox="0 0 1000 1066" style="color:#1F3B57">
 <text x="500" y="90" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="38" letter-spacing="8" fill="#B8862F">ALARM OFF · COCOA ON · SCHOOL'S CLOSED</text>
 <line x1="120" y1="132" x2="880" y2="132" stroke="#1F3B57" stroke-width="4"/>
 <text x="500" y="350" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="190" fill="#1F3B57" letter-spacing="-4">SNOW DAY</text>
 <text x="500" y="560" text-anchor="middle" font-family="Fraunces" font-weight="900" font-size="150" fill="#1F3B57" letter-spacing="-3">COMMITTEE</text>
 <text x="500" y="720" text-anchor="middle" font-family="Fraunces" font-style="italic" font-weight="600" font-size="120" fill="#B8862F">official member</text>

 <use href="#flake" transform="translate(500 905) scale(1.25)"/>
 <text x="500" y="1035" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="38" letter-spacing="10" fill="#1F3B57">MEETINGS CANCELED DUE TO WEATHER</text>
</svg></div>

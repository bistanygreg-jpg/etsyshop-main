<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,800;0,9..144,900;1,9..144,600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Barlow Condensed';position:relative;background:#EFE6D2}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#FBF6EC 0%,#EFE6D2 65%,#E2D4B8 100%)}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0}
.k{font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#8D1B1B}
.h{font-family:'Fraunces';font-weight:900;color:#1E2A22;line-height:.9}
.i{font-family:'Fraunces';font-style:italic;font-weight:600;color:#8D1B1B}
@keyframes show{0%{opacity:0}5%{opacity:1}95%{opacity:1}100%{opacity:0}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#s1{animation:show 2600ms both}
#s2{animation:show 2600ms 2500ms both}
#s3{animation:show 2000ms 5000ms both}
#s4{animation:fadein 500ms 6900ms both}
/* S1: hook + engraving wipe reveal */
.hook{position:absolute;top:150px;width:100%;animation:drop 600ms 100ms cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{from{transform:translateY(-120px);opacity:0}to{transform:none;opacity:1}}
.reveal{width:900px;height:900px;border-radius:50%;overflow:hidden;box-shadow:0 30px 70px rgba(40,30,20,.35);clip-path:circle(0% at 50% 50%);animation:iris 1100ms 500ms cubic-bezier(.3,.9,.3,1) both;margin-top:120px}
@keyframes iris{to{clip-path:circle(50% at 50% 50%)}}
.reveal img{width:100%;height:100%;object-fit:cover;object-position:50% 38%;animation:zoom 2600ms ease-out both}
@keyframes zoom{from{transform:scale(1.7) translateY(4%)}to{transform:scale(1.4) translateY(4%)}}
.sub{margin-top:60px;animation:pop 500ms 1300ms cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
/* S2: 3D flip front -> back */
.stage{perspective:2400px;margin-top:40px}
.flip{width:900px;height:1000px;position:relative;transform-style:preserve-3d;animation:flip 900ms 3400ms cubic-bezier(.6,0,.3,1) both}
@keyframes flip{to{transform:rotateY(180deg)}}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(40,30,20,.3)}
.face img{width:100%;height:100%;object-fit:cover}
.back{transform:rotateY(180deg)}
.lab{position:absolute;bottom:170px;font-size:64px;animation:swap 2600ms 2500ms steps(1) both}
@keyframes swap{0%{opacity:1}50%{opacity:1}}
/* S3: colour cycle */
.cycle{position:relative;width:900px;height:1000px;margin-top:40px}
.cycle img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:30px;box-shadow:0 30px 60px rgba(40,30,20,.3);opacity:0}
.c1{animation:cyc 1000ms 5000ms both}.c2{animation:cyc2 1100ms 5900ms both}
@keyframes cyc{0%{opacity:0;transform:scale(.94)}15%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
@keyframes cyc2{0%{opacity:0;transform:scale(.94)}15%{opacity:1;transform:none}100%{opacity:1}}
.dots{display:flex;gap:28px;margin-top:50px}
.dots span{width:78px;height:78px;border-radius:50%;border:5px solid #1E2A22;animation:pop 400ms both}
/* S4: end card */
.price{font-family:'Fraunces';font-weight:900;font-size:220px;color:#1E2A22;animation:pop 520ms 7200ms cubic-bezier(.2,1.6,.4,1) both}
.cta{margin-top:50px;background:#1E2A22;color:#FBF6EC;font-weight:700;font-size:66px;letter-spacing:.14em;padding:26px 64px;border-radius:90px;animation:pulse 900ms 7800ms ease-in-out infinite both}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style></head>
<body data-duration="9500">
<div class="bg"></div>

<div class="scene" id="s1">
 <div class="hook"><div class="k" style="font-size:72px">Cozy season dress code</div></div>
 <div class="reveal"><img src="../../design/apparel-kit/retail-preview/hot-cocoa-social-club_back-closeup.jpg"></div>
 <div class="sub h" style="font-size:150px">Hot Cocoa <span class="i">club</span></div>
</div>

<div class="scene" id="s2">
 <div class="k" style="font-size:58px">Front: a little chest emblem</div>
 <div class="stage"><div class="flip">
  <div class="face"><img src="../../design/apparel-kit/retail-preview/hot-cocoa-social-club_front-ivory.jpg"></div>
  <div class="face back"><img src="../../design/apparel-kit/retail-preview/hot-cocoa-social-club_back-ivory.jpg"></div>
 </div></div>
 <div class="k" style="font-size:58px;margin-top:40px;animation:pop 450ms 4300ms both">Back: the whole story</div>
</div>

<div class="scene" id="s3">
 <div class="k" style="font-size:58px">Soft, garment-dyed, 4 colours</div>
 <div class="cycle">
  <img class="c1" src="../../design/apparel-kit/retail-preview/hot-cocoa-social-club_back-ivory.jpg">
  <img class="c2" src="../../design/apparel-kit/retail-preview/hot-cocoa-social-club_back-butter.jpg">
 </div>
 <div class="dots">
  <span style="background:#F1EAD9;animation-delay:5200ms"></span>
  <span style="background:#A9B49B;animation-delay:5350ms"></span>
  <span style="background:#F2D27A;animation-delay:5500ms"></span>
  <span style="background:#EFC9C4;animation-delay:5650ms"></span>
 </div>
</div>

<div class="scene" id="s4">
 <div class="k" style="font-size:60px">Hot Cocoa Social Club tee</div>
 <div class="h" style="font-size:120px;margin-top:20px">Marshmallows<br><span class="i">required</span></div>
 <div class="price">$28.99</div>
 <div class="cta">LINK IN BIO</div>
 <div class="k" style="font-size:44px;margin-top:40px;color:#1E2A22">Order by Dec 8 for Christmas</div>
</div>
</body></html>

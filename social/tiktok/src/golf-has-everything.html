<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
  html,body { margin:0; background:#999; }
  .slide { position:relative; width:1080px; height:1920px; background:#FEE4C1; color:#151515; font-family:'Poppins', sans-serif;
    box-sizing:border-box; padding:0 100px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; overflow:hidden; }
  .slide + .slide { margin-top:20px; }
  .big { font-size:104px; line-height:1.12; font-weight:800; white-space:pre-line; letter-spacing:-1px; }
  .big.long { font-size:86px; }
  .small { font-size:56px; line-height:1.35; margin-top:48px; white-space:pre-line; color:#151515; opacity:.8; font-weight:600; }
  .cta .small { background:#3F7D3A; color:#fff; opacity:1; border-radius:40px; padding:30px 50px; font-size:50px; }
  .icon { width:520px; margin-top:70px; -webkit-mask-image: radial-gradient(ellipse at center, #000 58%, transparent 72%); }
  .count { position:absolute; top:230px; font-size:40px; opacity:.45; }
  .handle { position:absolute; bottom:300px; font-size:38px; opacity:.65; font-family:'Poppins', sans-serif; font-weight:600; }
</style></head><body>
<section class="slide">
<div class="count">1/4</div>
<div class="big">Buying for the golfer who has everything? 😩</div>
<div class="handle">@milestone.and.mea</div></section>
<section class="slide">
<div class="count">2/4</div>
<div class="big">Clubs ✔️
Rangefinder ✔️
400 golf balls ✔️</div>
<div class="handle">@milestone.and.mea</div></section>
<section class="slide">
<div class="count">3/4</div>
<div class="big">The one thing he doesn&#x27;t have…</div>
<div class="handle">@milestone.and.mea</div></section>
<section class="slide cta">
<div class="count">4/4</div>
<div class="big">His favorite course on the wall.</div>
<div class="small">Realistic golf course posters
free shipping · link in bio</div>
<img class="icon" src="img/flag.png">
<div class="handle">@milestone.and.mea</div></section>
</body></html>
